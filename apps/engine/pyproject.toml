[project]
name = "ultrathing-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "yt-dlp>=2024.8",
  "supabase>=2.7",
  "python-multipart>=0.0.9",
  "rembg[cpu]>=2.0",
  "pillow>=10.0",
  "pandas>=2.2",
  "pdfplumber>=0.11",
  "playwright>=1.47",
  "faster-whisper>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["rembg.*", "yt_dlp.*", "pandas.*", "faster_whisper.*"]
ignore_missing_imports = true
