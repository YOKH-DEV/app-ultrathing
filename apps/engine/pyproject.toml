[project]
name = "ultrathing-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "yt-dlp>=2024.8",
  "supabase>=2.7",
  # Fase 2+: "rembg", "playwright", "pandas"
]

[tool.ruff]
line-length = 100
